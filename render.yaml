services:
  - type: web
    name: luna-match-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: VLM_BACKEND
        value: groq
      - key: GROQ_MODEL
        value: qwen/qwen3.6-27b
      - key: GROQ_API_KEY
        sync: false
      - key: CORE_ML_USE_MOCK
        value: "true"
      - key: DEBUG
        value: "false"
